<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitation · Météo Outfits</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #4facfe, #1f2a5c); color: #fff; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; width: 100%; background: rgba(255,255,255,.14); border-radius: 20px; padding: 28px 24px; backdrop-filter: blur(8px); }
  h1 { font-size: 24px; margin: 0 0 8px; } p { margin: 0 0 16px; line-height: 1.5; opacity: .92; }
  .btn { display: block; text-align: center; padding: 14px 18px; border-radius: 14px; font-weight: 600; text-decoration: none; margin-top: 10px; }
  .primary { background: #fff; color: #1f2a5c; } .secondary { background: rgba(255,255,255,.2); color: #fff; }
  #who { font-weight: 700; }
  code { display: block; word-break: break-all; font-size: 12px; background: rgba(0,0,0,.25); padding: 10px; border-radius: 10px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>👯 Tenues assorties</h1>
  <p><span id="who">Un ami</span> te propose de coordonner vos tenues avec <strong>Météo Outfits</strong>, selon la météo là où vous vous retrouvez.</p>
  <a class="btn primary" id="open" href="#">Ouvrir dans l'appli</a>
  <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.meteooutfits.app">Installer l'appli (Android)</a>
  <p style="margin-top:16px;font-size:14px">Déjà l'appli mais le bouton ne marche pas ? Copie ce lien, puis dans l'appli : <em>Rendez-vous → J'ai reçu une invitation</em>.</p>
  <code id="link"></code>
</main>
<script>
  // Le code d'invitation est dans le fragment (#...) : il ne quitte jamais le navigateur.
  var code = location.hash.replace(/^#/, '');
  var link = location.href;
  document.getElementById('link').textContent = link;
  try {
    var json = JSON.parse(decodeURIComponent(escape(atob(code.replace(/-/g, '+').replace(/_/g, '/')))));
    if (json.from) document.getElementById('who').textContent = json.from;
  } catch (e) {}
  // Schéma personnalisé : ouvre l'appli si elle est installée, même sans App Links vérifiés.
  document.getElementById('open').href = 'meteooutfits://meetup#' + code;
</script>
</body>
</html>
